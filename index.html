<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RizeDev - Portfólio Dark</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            width: 100%;
            height: 100%;
        }
        body {
            /* Fundo roxo ultra escuro */
            background: linear-gradient(135deg, #0d0614 0%, #1a0933 50%, #05020a 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 90%;
            text-align: center;
        }

        /* Estilo da Foto de Perfil Redonda com Brilho Néon */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #a855f7;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.7);
            margin-bottom: 20px;
            display: inline-block;
        }

        h1 {
            color: #c084fc;
            font-size: 3.5rem;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(192, 132, 252, 0.8);
            letter-spacing: 2px;
        }

        p {
            color: #d8b4fe;
            margin-bottom: 40px;
            font-size: 1.3rem;
            line-height: 1.5;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 22px;
            margin: 15px 0;
            background: rgba(138, 43, 226, 0.15);
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            border-radius: 16px;
            border: 2px solid #a855f7;
            font-weight: bold;
            font-size: 1.3rem;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .btn:active, .btn:hover {
            background: #9333ea;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 0 30px #a855f7;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Foto de Perfil com o teu link direto -->
        <img src="https://i.imgur.com/CqjMt3O.jpeg" alt="Perfil RizeDev" class="profile-img">

        <h1>RizeDev</h1>
        <p>Criando jogos e aplicativos direto do celular Android.</p>

        <a class="btn" href="https://github.com/rizeyx" target="_blank">⚡ Meu GitHub</a>
        <a class="btn" href="#">📚 Tutoriais</a>
        <a class="btn" href="#">🎮 Jogos</a>
        <a class="btn" href="#">⚙️ Ports de Jogos</a
        <a class="btn" href="mailto:rizedevcode@gmail.com">✉️ Contato</a>
    </div>

</body>
</html>
